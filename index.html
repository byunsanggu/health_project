<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건강 기록</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<header class="topbar">
  <h1>건강 기록</h1>
  <div class="topbar-actions">
    <button id="btn-settings" type="button" class="ghost">설정</button>
    <button id="btn-export" type="button" class="ghost">내보내기</button>
    <label class="ghost file-label">
      가져오기
      <input id="input-import" type="file" accept="application/json" hidden>
    </label>
  </div>
</header>

<main>
  <section class="cards" id="summary" aria-label="요약"></section>

  <section class="panel">
    <h2>오늘 기록</h2>
    <form id="entry-form" class="entry-form">
      <div class="field">
        <label for="f-date">날짜</label>
        <input id="f-date" name="date" type="date" required>
      </div>
      <div class="field">
        <label for="f-weight">체중 (kg)</label>
        <input id="f-weight" name="weight" type="number" step="0.1" min="0" max="500" inputmode="decimal" placeholder="68.5">
      </div>
      <div class="field">
        <label for="f-exercise">운동 (분)</label>
        <input id="f-exercise" name="exercise" type="number" step="1" min="0" max="1440" inputmode="numeric" placeholder="30">
      </div>
      <div class="field">
        <label for="f-calories">섭취 칼로리 (kcal)</label>
        <input id="f-calories" name="calories" type="number" step="1" min="0" max="20000" inputmode="numeric" placeholder="2000">
      </div>
      <div class="field">
        <label for="f-sleep">수면 (시간)</label>
        <input id="f-sleep" name="sleep" type="number" step="0.5" min="0" max="24" inputmode="decimal" placeholder="7">
      </div>
      <div class="field">
        <label for="f-water">물 (잔)</label>
        <input id="f-water" name="water" type="number" step="1" min="0" max="50" inputmode="numeric" placeholder="8">
      </div>
      <div class="field field-wide">
        <label for="f-memo">메모</label>
        <input id="f-memo" name="memo" type="text" maxlength="200" placeholder="컨디션, 식단 등">
      </div>
      <div class="form-actions">
        <button type="submit">저장</button>
        <button type="button" id="btn-reset" class="ghost">지우기</button>
        <span id="form-hint" class="hint" role="status"></span>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>체중 추이</h2>
      <span class="muted">최근 30일</span>
    </div>
    <div id="chart-weight" class="chart"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>운동 시간</h2>
      <span class="muted">최근 14일</span>
    </div>
    <div id="chart-exercise" class="chart"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>기록 목록</h2>
      <span class="muted" id="entry-count"></span>
    </div>
    <div class="table-wrap">
      <table id="entry-table">
        <thead>
          <tr>
            <th>날짜</th><th>체중</th><th>운동</th><th>칼로리</th><th>수면</th><th>물</th><th>메모</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <p id="empty-state" class="muted empty">아직 기록이 없습니다. 위에서 첫 기록을 추가해 보세요.</p>
  </section>
</main>

<dialog id="settings-dialog">
  <form method="dialog" id="settings-form">
    <h2>설정</h2>
    <div class="field">
      <label for="s-height">키 (cm)</label>
      <input id="s-height" type="number" step="0.1" min="50" max="260" inputmode="decimal" placeholder="172">
    </div>
    <div class="field">
      <label for="s-target">목표 체중 (kg)</label>
      <input id="s-target" type="number" step="0.1" min="0" max="500" inputmode="decimal" placeholder="65">
    </div>
    <div class="form-actions">
      <button value="save">저장</button>
      <button value="cancel" class="ghost" formnovalidate>닫기</button>
    </div>
  </form>
</dialog>

<script src="src/app.js"></script>
</body>
</html>
