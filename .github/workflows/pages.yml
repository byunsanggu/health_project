# 프로토타입을 GitHub Pages로 배포한다.
#
# 아티팩트 링크로는 홈 화면에 설치할 수 없다 — 뷰어 안에서 열리고 로그인이
# 필요하기 때문이다. 설치되는 PWA가 되려면 평범한 공개 HTTPS 주소가 있어야
# 한다. 이 워크플로가 그 주소를 만든다.
name: Deploy prototype to Pages

on:
  push:
    # 이 저장소에는 아직 main이 없다. 작업 브랜치가 기본 브랜치라서
    # main만 걸어 두면 이 워크플로는 영영 안 돈다.
    branches: [main, master, 'claude/**']
    paths:
      - 'prototype/**'
      - 'src/engine/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 실행은 최신 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 의존성 설치
        run: npm ci

      - name: 타입체크와 테스트
        run: npm run check

      - name: 프로토타입 빌드
        # 접속 정보는 저장소가 아니라 Actions 비밀값에 둔다. 서버를 옮길 때
        # 코드를 안 고쳐도 되고, 저장소 이력에 열쇠가 남지 않는다.
        #
        # publishable(anon) 열쇠는 공개를 전제로 설계된 값이라 빌드 결과에
        # 들어가도 된다 — 남의 기록은 이 열쇠가 아니라 DB의 RLS가 막는다.
        # build.mjs가 secret / service_role 열쇠는 빌드를 세워서 막는다.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node prototype/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
